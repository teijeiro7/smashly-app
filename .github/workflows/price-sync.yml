name: Catalog & Price Sync

on:
  schedule:
    - cron: '0 5 * * 0' # Cada domingo 05:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit products/URLs per store (testing)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no writes to Supabase)'
        required: false
        default: false
        type: boolean

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

permissions:
  contents: read

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify required secrets are present
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY secret. Configure them under Settings > Secrets and variables > Actions before this workflow can do anything."
            exit 1
          fi
          echo "Secrets present."

  refresh:
    needs: check-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        store: [padelmarket, padelnuestro, padelproshop]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: src/scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r src/scrapers/requirements.txt

      - name: Refresh prices — ${{ matrix.store }}
        env:
          SYNC_LIMIT: ${{ github.event.inputs.limit }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS="refresh --store ${{ matrix.store }}"
          if [ -n "$SYNC_LIMIT" ]; then ARGS="$ARGS --limit $SYNC_LIMIT"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python3 -m src.scrapers.sync_catalog $ARGS

  discover:
    needs: refresh
    if: ${{ !cancelled() }} # keep discovering/deduping even if one store's refresh guardrail tripped
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: src/scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r src/scrapers/requirements.txt

      - name: Discover new rackets, mark discontinued, dedupe
        env:
          SYNC_LIMIT: ${{ github.event.inputs.limit }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS="discover"
          if [ -n "$SYNC_LIMIT" ]; then ARGS="$ARGS --limit $SYNC_LIMIT"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python3 -m src.scrapers.sync_catalog $ARGS

      - name: Sync radar metrics (missing only)
        run: python3 -m src.scrapers.sync_radar_metrics
