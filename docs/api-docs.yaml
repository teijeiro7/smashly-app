openapi: 3.0.0
info:
  title: Smashly App - API Documentation
  description: Documentación de la API de Smashly App
  version: 1.0.0
servers:
  - url: http://localhost:443/api/v1
    description: Servidor local de desarrollo
  - url: https://api.smashlyapp.com/api/v1
    description: Servidor de producción

paths:
  # ==========================================
  # HEALTH - Health check endpoints
  # ==========================================
  /health:
    get:
      summary: Health check
      tags:
        - Health
      description: Verifica el estado del servicio y la conexión a la base de datos
      responses:
        "200":
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                  message:
                    type: string
        "503":
          description: Servicio no disponible

  /health/deep:
    get:
      summary: Health check detallado
      tags:
        - Health
      description: Verifica el estado del servicio con detalles completos de base de datos, variables de entorno y memoria
      responses:
        "200":
          description: Todos los sistemas operativos
        "503":
          description: Algunos sistemas no operativos

  # ==========================================
  # RACKETS - Endpoints de palas
  # ==========================================
  /rackets:
    get:
      summary: Obtener palas (con paginación opcional)
      tags:
        - Rackets
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Número de página
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Cantidad de resultados por página
      responses:
        "200":
          description: Lista de palas

  /rackets/search:
    get:
      summary: Buscar palas por query
      tags:
        - Rackets
      description: Busca palas por nombre, marca o modelo
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: Término de búsqueda
      responses:
        "200":
          description: Resultados de búsqueda

  /rackets/filter:
    get:
      summary: Filtrar palas con filtros avanzados
      tags:
        - Rackets
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Palas filtradas

  /rackets/bestsellers:
    get:
      summary: Obtener palas más vendidas
      tags:
        - Rackets
      responses:
        "200":
          description: Lista de bestsellers

  /rackets/offers:
    get:
      summary: Obtener palas en oferta
      tags:
        - Rackets
      responses:
        "200":
          description: Lista de ofertas

  /rackets/brands:
    get:
      summary: Obtener marcas disponibles
      tags:
        - Rackets
      responses:
        "200":
          description: Lista de marcas

  /rackets/stats:
    get:
      summary: Estadísticas de palas
      tags:
        - Rackets
      responses:
        "200":
          description: Estadísticas

  /rackets/brands/{brand}:
    get:
      summary: Obtener palas por marca
      tags:
        - Rackets
      parameters:
        - in: path
          name: brand
          required: true
          schema:
            type: string
          description: Nombre de la marca
      responses:
        "200":
          description: Palas de la marca

  /rackets/{id}:
    get:
      summary: Obtener una pala por ID
      tags:
        - Rackets
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID de la pala
      responses:
        "200":
          description: Detalle de la pala
        "404":
          description: Pala no encontrada

  # ==========================================
  # AUTH — STALE, no backend implementation exists.
  # Auth is entirely client-side via Supabase Auth (@supabase/supabase-js);
  # see frontend/src/contexts/AuthContext.tsx. The /auth/* endpoints
  # previously documented here (login, register, logout, refresh, me) do
  # not exist anywhere in api/. Removed 2026-07-28.
  # ==========================================

  # ==========================================
  # USERS - Gestión de usuarios
  # ==========================================
  /users/profile:
    get:
      summary: Obtener perfil del usuario autenticado
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil del usuario
        "401":
          description: No autenticado

    post:
      summary: Crear perfil de usuario
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Perfil creado
        "400":
          description: Datos inválidos

    put:
      summary: Actualizar perfil del usuario
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Perfil actualizado
        "401":
          description: No autenticado

    delete:
      summary: Eliminar perfil del usuario
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil eliminado
        "401":
          description: No autenticado

  /users/nickname/{nickname}/available:
    get:
      summary: Verificar disponibilidad de nickname
      tags:
        - Users
      parameters:
        - in: path
          name: nickname
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Disponibilidad del nickname

  /users/search:
    get:
      summary: Buscar usuarios por nickname
      tags:
        - Users
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: Término de búsqueda
      responses:
        "200":
          description: Resultados de búsqueda

  /users/stats:
    get:
      summary: Obtener estadísticas de usuarios (admin)
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Estadísticas de usuarios
        "401":
          description: No autenticado
        "403":
          description: No autorizado

  # ==========================================
  # LISTS - Gestión de listas de palas
  # ==========================================
  /lists:
    get:
      summary: Obtener todas las listas del usuario autenticado
      tags:
        - Lists
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Listas del usuario
        "401":
          description: No autenticado

    post:
      summary: Crear nueva lista
      tags:
        - Lists
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: Lista creada
        "401":
          description: No autenticado

  /lists/{id}:
    get:
      summary: Obtener lista por ID
      tags:
        - Lists
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalle de la lista
        "404":
          description: Lista no encontrada

    put:
      summary: Actualizar lista
      tags:
        - Lists
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Lista actualizada

    delete:
      summary: Eliminar lista
      tags:
        - Lists
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lista eliminada

  /lists/{id}/rackets:
    post:
      summary: Agregar pala a lista
      tags:
        - Lists
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - racketId
              properties:
                racketId:
                  type: string
      responses:
        "200":
          description: Pala agregada

  /lists/{id}/rackets/{racketId}:
    delete:
      summary: Eliminar pala de lista
      tags:
        - Lists
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: racketId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pala eliminada de la lista

  # ==========================================
  # REVIEWS - Sistema de reviews y comentarios
  # ==========================================
  /reviews:
    get:
      summary: Información sobre rutas de reviews disponibles
      tags:
        - Reviews
      responses:
        "200":
          description: Información de la API de reviews

    post:
      summary: Crear nueva review
      tags:
        - Reviews
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - racket_id
                - title
                - content
                - rating
              properties:
                racket_id:
                  type: string
                title:
                  type: string
                content:
                  type: string
                rating:
                  type: number
                  minimum: 1
                  maximum: 5
      responses:
        "201":
          description: Review creada
        "400":
          description: Datos inválidos
        "401":
          description: No autenticado

  /reviews/rackets/{racketId}:
    get:
      summary: Obtener reviews de una pala
      tags:
        - Reviews
      parameters:
        - in: path
          name: racketId
          required: true
          schema:
            type: string
        - in: query
          name: rating
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: Filtrar por rating
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, oldest, rating_high, rating_low]
          description: Ordenamiento
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Reviews de la pala

  /reviews/users/{userId}:
    get:
      summary: Obtener reviews de un usuario
      tags:
        - Reviews
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Reviews del usuario

  /reviews/{reviewId}:
    get:
      summary: Obtener review específica
      tags:
        - Reviews
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalle de la review
        "404":
          description: Review no encontrada

    put:
      summary: Actualizar review
      tags:
        - Reviews
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                rating:
                  type: number
                  minimum: 1
                  maximum: 5
      responses:
        "200":
          description: Review actualizada
        "401":
          description: No autenticado
        "403":
          description: No autorizado

    delete:
      summary: Eliminar review
      tags:
        - Reviews
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review eliminada
        "401":
          description: No autenticado
        "403":
          description: No autorizado

  /reviews/{reviewId}/comments:
    get:
      summary: Obtener comentarios de una review
      tags:
        - Reviews
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comentarios de la review

    post:
      summary: Agregar comentario a una review
      tags:
        - Reviews
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
      responses:
        "201":
          description: Comentario agregado
        "401":
          description: No autenticado

  /reviews/{reviewId}/like:
    post:
      summary: Dar/quitar like a una review (toggle)
      tags:
        - Reviews
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Like actualizado
        "401":
          description: No autenticado

  /reviews/comments/{commentId}:
    delete:
      summary: Eliminar un comentario
      tags:
        - Reviews
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: commentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comentario eliminado
        "401":
          description: No autenticado
        "403":
          description: No autorizado

  # ==========================================
  # STORES - Gestión de tiendas
  # ==========================================
  /stores:
    get:
      summary: Obtener todas las tiendas
      tags:
        - Stores
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: verified
          schema:
            type: boolean
          description: Filtrar por tiendas verificadas
      responses:
        "200":
          description: Lista de tiendas

    post:
      summary: Crear nueva solicitud de tienda
      tags:
        - Stores
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: Solicitud de tienda creada
        "401":
          description: No autenticado

  /stores/me:
    get:
      summary: Obtener tienda del usuario actual
      tags:
        - Stores
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tienda del usuario
        "401":
          description: No autenticado
        "404":
          description: Tienda no encontrada

  /stores/{id}:
    get:
      summary: Obtener tienda por ID
      tags:
        - Stores
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalle de la tienda
        "404":
          description: Tienda no encontrada

    put:
      summary: Actualizar tienda (propietario o admin)
      tags:
        - Stores
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Tienda actualizada
        "401":
          description: No autenticado
        "403":
          description: No autorizado

    delete:
      summary: Eliminar tienda (propietario o admin)
      tags:
        - Stores
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tienda eliminada
        "401":
          description: No autenticado
        "403":
          description: No autorizado

  # ==========================================
  # ADMIN - Endpoints administrativos
  # ==========================================
  /admin/metrics:
    get:
      summary: Obtener métricas del dashboard
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Métricas del sistema
        "401":
          description: No autenticado
        "403":
          description: Requiere rol de administrador

  /admin/users:
    get:
      summary: Obtener todos los usuarios
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de usuarios
        "401":
          description: No autenticado
        "403":
          description: Requiere rol de administrador

  /admin/users/{userId}/role:
    patch:
      summary: Actualizar rol de un usuario
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [user, admin, store_owner]
      responses:
        "200":
          description: Rol actualizado
        "401":
          description: No autenticado
        "403":
          description: Requiere rol de administrador

  /admin/users/{userId}:
    delete:
      summary: Eliminar un usuario
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usuario eliminado
        "401":
          description: No autenticado
        "403":
          description: Requiere rol de administrador

  /admin/racket-requests:
    get:
      summary: Obtener todas las solicitudes de palas
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de solicitudes de palas
        "401":
          description: No autenticado
        "403":
          description: Requiere rol de administrador

  /admin/store-requests:
    get:
      summary: Obtener todas las solicitudes de tiendas
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de solicitudes de tiendas
        "401":
          description: No autenticado
        "403":
          description: Requiere rol de administrador

  /admin/stores/{id}/verify:
    post:
      summary: Aprobar/verificar una tienda
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tienda verificada
        "401":
          description: No autenticado
        "403":
          description: Requiere rol de administrador

  /admin/stores/{id}/reject:
    delete:
      summary: Rechazar una solicitud de tienda
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Solicitud rechazada
        "401":
          description: No autenticado
        "403":
          description: Requiere rol de administrador

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

tags:
  - name: Health
    description: Health check endpoints
  - name: Rackets
    description: Endpoints de palas (búsqueda, filtros, detalles)
  - name: Auth
    description: Autenticación y autorización
  - name: Users
    description: Gestión de perfiles de usuarios
  - name: Lists
    description: Gestión de listas de palas favoritas
  - name: Reviews
    description: Sistema de reviews y comentarios de palas
  - name: Stores
    description: Gestión de tiendas
  - name: Admin
    description: Endpoints administrativos (requiere rol admin)
